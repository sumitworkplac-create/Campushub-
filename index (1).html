/* ============================================================
   ESCAPE HTML
============================================================ */

function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* ============================================================
   LOADING
============================================================ */

function showLoading(
    show,
    message = "Loading..."
) {

    DOM.loadingText.textContent = message;

    if (show) {

        DOM.loadingOverlay.classList.remove("hidden");

        DOM.loadingOverlay.classList.add("flex");

    } else {

        DOM.loadingOverlay.classList.add("hidden");

        DOM.loadingOverlay.classList.remove("flex");

    }

}


/* ============================================================
   TOAST
============================================================ */

function showToast(
    message,
    type = "success"
) {

    const toast = document.createElement("div");

    const settings = {

        success: {
            icon: "fa-circle-check",
            color: "bg-green-600"
        },

        error: {
            icon: "fa-circle-exclamation",
            color: "bg-red-600"
        },

        info: {
            icon: "fa-circle-info",
            color: "bg-indigo-600"
        },

        warning: {
            icon: "fa-triangle-exclamation",
            color: "bg-amber-500"
        }

    };


    const setting =
        settings[type] ||
        settings.info;


    toast.className =
        `${setting.color} text-white px-4 py-3 rounded-xl shadow-lg flex items-center gap-3 text-sm font-semibold fade-in`;


    toast.innerHTML = `

        <i class="fas ${setting.icon}"></i>

        <span class="flex-1">
            ${escapeHtml(message)}
        </span>

        <button type="button">
            <i class="fas fa-xmark"></i>
        </button>

    `;


    toast.querySelector("button")
        .addEventListener(
            "click",
            () => toast.remove()
        );


    DOM.toastContainer.appendChild(toast);


    setTimeout(() => {

        if (toast.isConnected) {
            toast.remove();
        }

    }, 4000);

}


/* ============================================================
   DATE
============================================================ */

function formatDate(timestamp) {

    if (!timestamp) {
        return "Just now";
    }

    try {

        let date;

        if (
            timestamp &&
            typeof timestamp.toDate === "function"
        ) {

            date = timestamp.toDate();

        } else {

            date = new Date(timestamp);

        }


        if (Number.isNaN(date.getTime())) {
            return "Just now";
        }


        return date.toLocaleString(
            "en-IN",
            {
                day: "numeric",
                month: "short",
                year: "numeric",
                hour: "numeric",
                minute: "2-digit"
            }
        );

    } catch {

        return "Just now";

    }

}

        >

/* ============================================================
   GOOGLE LOGIN
============================================================ */

/*
    THIS IS THE IMPORTANT BUG FIX.

    We ONLY use signInWithPopup().

    There is NO:
        signInWithRedirect()
        getRedirectResult()

    Therefore the browser will not enter the Firebase
    redirect handler that produced your screenshot.
*/

async function loginWithGoogle() {

    if (!auth) {

        showToast(
            "Firebase Authentication is not available.",
            "error"
        );

        return;

    }


    DOM.authError.classList.add("hidden");

    DOM.googleLoginBtn.disabled = true;

    showLoading(
        true,
        "Connecting with Google..."
    );


    try {

        const result =
            await signInWithPopup(
                auth,
                googleProvider
            );


        console.log(
            "Google login successful:",
            result.user.email
        );


    } catch (error) {

        console.error(
            "Google login error:",
            error
        );


        let message =
            "Google sign-in failed. Please try again.";


        switch (error.code) {

            case "auth/popup-blocked":

                message =
                    "Google login popup was blocked. Please allow popups for this website and try again.";

                break;


            case "auth/popup-closed-by-user":

                message =
                    "Google sign-in was cancelled.";

                break;


            case "auth/cancelled-popup-request":

                message =
                    "A Google login window is already open.";

                break;


            case "auth/unauthorized-domain":

                message =
                    "This website domain is not authorized in Firebase Authentication.";

                break;


            case "auth/operation-not-allowed":

                message =
                    "Google Authentication is not enabled in Firebase.";

                break;


            case "auth/network-request-failed":

                message =
                    "Network error. Please check your internet connection.";

                break;


            case "auth/account-exists-with-different-credential":

                message =
                    "An account already exists with another sign-in method.";

                break;


            default:

                if (error.message) {
                    message = error.message;
                }

        }


        DOM.authError.textContent =
            message;

        DOM.authError.classList.remove(
            "hidden"
        );


        showToast(
            message,
            "error"
        );

    } finally {

        DOM.googleLoginBtn.disabled = false;

        showLoading(false);

    }

}


DOM.googleLoginBtn.addEventListener(
    "click",
    loginWithGoogle
);

        appData = {

        };


        currentPage = "home";


        DOM.app.classList.add(
            "hidden"
        );

        DOM.authScreen.classList.remove(

    } catch (error) {

        );


        showToast(
            "Logout failed. Please try again.",

        );

    } finally {

    }

}

async function checkProfileAndLoadData() {

    if (!currentUser) {
        return;
    }


    try {

        showLoading(
            true,
            "Loading your profile..."
        );


        const userRef =
            doc(
                db,
                "users",
                currentUser.uid
            );


        const userSnap =
            await getDoc(userRef);


        if (userSnap.exists()) {

            currentUserProfile =
                userSnap.data();


            DOM.authScreen.classList.add(
                "hidden"
            );

            DOM.app.classList.remove(
                "hidden"
            );


            await setupRealtimeListeners();


            render();


        } else {

            /*
                New user.
                Automatically fill Google name.
            */

            DOM.profileName.value =
                currentUser.displayName ||
                currentUser.email?.split("@")[0] ||
                "";


            DOM.profileRole.value =
                "student";


            DOM.profilePasscode.value =
                "";


            DOM.authScreen.classList.add(
                "hidden"
            );

            DOM.app.classList.remove(
                "hidden"
            );


            openProfileModal();

        }


    } catch (error) {

        console.error(
            "Profile error:",
            error
        );


        showToast(
            "Could not load your profile. Check Firestore permissions.",
            "error"
        );


    } finally {

        showLoading(false);

    }

}

DOM.profileForm.addEventListener(
    "submit",
    async (event) => {

        event.preventDefault();


        if (!currentUser) {

            showToast(
                "Please login first.",
                "error"
            );

            return;

        }


        const name =
            DOM.profileName.value.trim();


        const role =
            DOM.profileRole.value;


        const passcode =
            DOM.profilePasscode.value;


        if (!name) {

            showToast(
                "Please enter your name.",
                "error"
            );

            return;

        }


        if (
            role === "admin" ||
            role === "faculty"
        ) {

            if (
                passcode !== passcodes[role]
            ) {

                showToast(
                    "Invalid security passcode.",
                    "error"
                );

                return;

            }

        }


        try {

            showLoading(
                true,
                "Saving profile..."
            );


            const profileData = {

                uid:
                    currentUser.uid,

                name:
                    name,

                role:
                    role,

                photoURL:

                "error"
            );


        } finally {

            showLoading(false);

    }
);


/* ============================================================
   REALTIME FIRESTORE
============================================================ */

async function setupRealtimeListeners() {

    if (!currentUser) {
        return;
    }


    /*
        Remove previous listeners.
    */

    if (unsubscribeQuestions) {
        unsubscribeQuestions();
    }

    if (unsubscribeAnswers) {
        unsubscribeAnswers();
    }

    if (unsubscribeNotes) {
        unsubscribeNotes();
    }


    /* ================= QUESTIONS ================= */

    unsubscribeQuestions =
        onSnapshot(

            collection(
                db,
                "questions"
            ),

            snapshot => {

                appData.questions =
                    snapshot.docs.map(
                        item => ({

                            id:
                                item.id,

                            ...item.data()

                        })
                    );


                appData.questions.sort(
                    (a, b) => {

                        const aTime =
                            a.createdAt?.toMillis?.() ||
                            0;

                        const bTime =
                            b.createdAt?.toMillis?.() ||
                            0;

                        return bTime - aTime;

                    }
                );


                render();

            },

            error => {

                console.error(
                    "Questions listener:",
                    error
                );

                showToast(
                    "Unable to load questions.",
                    "error"
                );

            }

        );


    /* ================= ANSWERS ================= */

    unsubscribeAnswers =
        onSnapshot(

            collection(
                db,
                "answers"
            ),

            snapshot => {

                appData.answers =
                    snapshot.docs.map(
                        item => ({

                            id:
                                item.id,

                            ...item.data()

                        })
                    );


                appData.answers.sort(
                    (a, b) => {

                        const aTime =
                            a.createdAt?.toMillis?.() ||
                            0;

                        const bTime =
                            b.createdAt?.toMillis?.() ||
                            0;

                        return aTime - bTime;

                    }
                );


                render();

            },

            error => {

                console.error(
                    "Answers listener:",
                    error
                );

            }

        );


    /* ================= NOTES ================= */

    unsubscribeNotes =
        onSnapshot(

            collection(
                db,
                "notes"
            ),

            snapshot => {

                appData.notes =
                    snapshot.docs.map(
                        item => ({

                            id:
                                item.id,

                            ...item.data()

                        })
                    );


                appData.notes.sort(
                    (a, b) => {

                        const aTime =
                            a.createdAt?.toMillis?.() ||
                            0;

                        const bTime =
                            b.createdAt?.toMillis?.() ||
                            0;

                        return bTime - aTime;

                    }
                );


                render();

            },

            error => {

                console.error(
                    "Notes listener:",
                    error
                );

                showToast(
                    "Unable to load notes.",
                    "error"
                );

            }

        );

}

/* ============================================================
   DELETE QUESTION
============================================================ */

window.deleteQuestion =
    async function(questionId) {

        if (!currentUser) {
            return;
        }


        const question =
            appData.questions.find(
                item =>
                    item.id === questionId
            );


        if (!question) {
            return;
        }


        const isOwner =
            question.authorId ===
            currentUser.uid;


        const isAdmin =
            currentUserProfile?.role ===
            "admin";


        if (!isOwner && !isAdmin) {

            showToast(
                "You cannot delete this question.",
                "error"
            );

            return;

        }


        if (
            !confirm(
                "Delete this question?"
            )
        ) {
            return;
        }


        try {

            await deleteDoc(

                doc(
                    db,
                    "questions",
                    questionId
                )

            );


            /*
                Delete related answers.
            */

            const relatedAnswers =
                appData.answers.filter(
                    answer =>
                        answer.questionId ===
                        questionId
                );


            for (
                const answer
                of relatedAnswers
            ) {

                try {

                    await deleteDoc(

                        doc(
                            db,
                            "answers",
                            answer.id
                        )

                    );

                } catch (error) {

                    console.warn(
                        "Could not delete answer:",
                        error
                    );

                }

            }


            showToast(
                "Question deleted.",
                "success"
            );


        } catch (error) {

            console.error(
                "Delete question error:",
                error
            );


            showToast(
                "Could not delete question.",
                "error"
            );

        }

    };

                        type="url"
                        placeholder="PDF URL"
                        class="sm:col-span-2 border border-gray-200 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-indigo-500"
                    >


                    <button
                        type="submit"
                        class="sm:col-span-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition"
                    >
                        <i class="fas fa-plus mr-2"></i>
                        Add Note
                    </button>

                </form>

            </div>

        `;

    }


    html += `

        <div class="flex items-center justify-between">

            <div>

                <h2 class="text-xl font-bold text-gray-900">
                    Study Notes
                </h2>

                <p class="text-sm text-gray-500">
                    Access notes shared on CampusHub.
                </p>

            </div>


            <span
                class="text-xs bg-indigo-50 text-indigo-700 font-bold px-3 py-1.5 rounded-full"
            >

                ${appData.notes.length}

                ${
                    appData.notes.length === 1
                        ? "Note"
                        : "Notes"
                }

            </span>

        </div>


        <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-5">

    `;


    if (
        appData.notes.length === 0
    ) {

        html += `

            <div
                class="sm:col-span-2 lg:col-span-3 bg-white border border-dashed border-gray-300 rounded-xl p-10 text-center"
            >

                <div
                    class="w-14 h-14 bg-gray-100 text-gray-400 rounded-full flex items-center justify-center mx-auto mb-4"
                >
                    <i class="fas fa-book-open text-xl"></i>
                </div>

                <h3 class="font-bold text-gray-800 mb-1">
                    No notes available
                </h3>

                <p class="text-sm text-gray-500">
                    Study notes will appear here.
                </p>

            </div>

        `;

    }


    for (
        const note
        of appData.notes
    ) {

        const isOwner =
            note.authorId ===
            currentUser.uid;


        const isAdmin =
            currentUserProfile?.role ===
            "admin";


        html += `

            <div
                class="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden"
            >

                <div class="p-5">

                    <div
                        class="w-12 h-12 bg-red-50 text-red-500 rounded-xl flex items-center justify-center mb-4"
                    >
                        <i class="fas fa-file-pdf text-xl"></i>
                    </div>


                    <div
                        class="text-xs text-indigo-600 font-bold uppercase tracking-wide mb-1"
                    >
                        ${escapeHtml(
                            note.subject ||
                            "Study Note"
                        )}
                    </div>


                    <h3
                        class="font-bold text-gray-900 text-lg mb-2"
                    >
                        ${escapeHtml(
                            note.title
                        )}
                    </h3>


                    <p
                        class="text-xs text-gray-500 mb-5"
                    >

                        Shared by

                        ${escapeHtml(
                            note.authorName ||
                            "User"
                        )}

                        •

                        ${formatDate(
                            note.createdAt
                        )}

                    </p>


                    <div class="flex gap-2">

                        <button
                            onclick="openPdfViewer('${escapeHtml(note.pdfUrl)}', '${escapeHtml(note.title)}')"
                            class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg text-sm"
                        >
                            <i class="fas fa-eye mr-1"></i>
                            Open
                        </button>


                        ${
                            isOwner || isAdmin
                                ? `

                                    <button
                                        onclick="deleteNote('${note.id}')"
                                        class="w-10 border border-gray-200 hover:border-red-200 hover:text-red-600 rounded-lg"
                                    >
                                        <i class="fas fa-trash"></i>
                                    </button>

                                  `
                                : ""
                        }

                    </div>

                </div>

            </div>

        `;

    }


    html += `

        </div>

        </div>

    `;


    return html;

}


/* ============================================================
   PROFILE
============================================================ */

function renderProfile() {

    const name =
        getCurrentUserName();


    const email =
        currentUser?.email ||
        currentUserProfile?.email ||
        "";


    const role =
        currentUserProfile?.role ||
        "student";


    const photo =
        currentUserProfile?.photoURL ||
        currentUser?.photoURL ||
        "";


    const questionCount =
        appData.questions.filter(
            q =>
                q.authorId ===
                currentUser.uid
        ).length;


    const noteCount =
        appData.notes.filter(
            n =>
                n.authorId ===
                currentUser.uid
        ).length;


    return `

        <div class="max-w-2xl mx-auto fade-in">

            <div
                class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden"
            >

                <div
                    class="bg-gradient-to-r from-indigo-600 to-indigo-700 h-28"
                ></div>


                <div class="px-6 pb-6">

                    <div class="-mt-12 mb-5">

                        ${
                            photo

                                ? `

                                    <img
                                        src="${escapeHtml(photo)}"
                                        class="w-24 h-24 rounded-2xl border-4 border-white shadow object-cover"
                                        alt="Profile"
                                    >

                                  `

                                : `

                                    <div
                                        class="w-24 h-24 rounded-2xl border-4 border-white shadow bg-indigo-100 text-indigo-700 flex items-center justify-center text-3xl font-bold"
                                    >
                                        ${escapeHtml(
                                            name
                                                .charAt(0)
                                                .toUpperCase()
                                        )}
                                    </div>

                                  `
                        }

                    </div>


                    <h1
                        class="text-2xl font-extrabold text-gray-900"
                    >
                        ${escapeHtml(name)}
                    </h1>


                    <p class="text-gray-500 mt-1">
                        ${escapeHtml(email)}
                    </p>


                    <div
                        class="mt-5 inline-flex items-center gap-2 bg-indigo-50 text-indigo-700 px-3 py-2 rounded-lg text-sm font-bold"
                    >

                        <i class="fas fa-user-shield"></i>

                        ${getRoleLabel(role)}

                    </div>


                    <div
                        class="mt-6 pt-6 border-t border-gray-100 grid sm:grid-cols-2 gap-4"
                    >

                        <div
                            class="bg-gray-50 rounded-xl p-4"
                        >

                            <div
                                class="text-xs text-gray-500 mb-1"
                            >
                                Questions
                            </div>

                            <div
                                class="text-2xl font-extrabold text-gray-900"
                            >
                                ${questionCount}
                            </div>

                        </div>


                        <div
                            class="bg-gray-50 rounded-xl p-4"
                        >

                            <div
                                class="text-xs text-gray-500 mb-1"
                            >
                                Notes
                            </div>

                            <div
                                class="text-2xl font-extrabold text-gray-900"
                            >
                                ${noteCount}
                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    `;

}


/* ============================================================
   ADMIN
============================================================ */

function renderAdmin() {

    if (
        currentUserProfile?.role !==
        "admin"
    ) {

        return `

            <div class="max-w-xl mx-auto text-center py-20">

                <div
                    class="w-16 h-16 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-5"
                >
                    <i class="fas fa-lock text-2xl"></i>
                </div>


                <h2 class="text-xl font-bold">
                    Access Denied
                </h2>


                <p class="text-gray-500 mt-2">
                    You do not have permission to access the admin panel.
                </p>

            </div>

        `;

    }


    return `

        <div class="max-w-6xl mx-auto space-y-6 fade-in">

            <div>

                <h1 class="text-2xl font-extrabold text-gray-900">
                    Admin Dashboard
                </h1>

                <p class="text-gray-500 mt-1">
                    Manage and monitor CampusHub.
                </p>

            </div>


            <div
                class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4"
            >

                <div
                    class="bg-white rounded-xl border border-gray-100 shadow-sm p-5"
                >

                    <div class="text-sm text-gray-500">
                        Questions
                    </div>

                    <div class="text-3xl font-extrabold mt-2">
                        ${appData.questions.length}
                    </div>

                </div>


                <div
                    class="bg-white rounded-xl border border-gray-100 shadow-sm p-5"
                >

                    <div class="text-sm text-gray-500">
                        Answers
                    </div>

                    <div class="text-3xl font-extrabold mt-2">
                        ${appData.answers.length}
                    </div>

                </div>


                <div
                    class="bg-white rounded-xl border border-gray-100 shadow-sm p-5"
                >

                    <div class="text-sm text-gray-500">
                        Notes
                    </div>

                    <div class="text-3xl font-extrabold mt-2">
                        ${appData.notes.length}
                    </div>

                </div>


                <div
                    class="bg-white rounded-xl border border-gray-100 shadow-sm p-5"
                >

                    <div class="text-sm text-gray-500">
                        Current Mode
                    </div>

                    <div
                        class="text-3xl font-extrabold mt-2 capitalize"
                    >
                        ${escapeHtml(
                            adminActiveMode
                        )}
                    </div>

                </div>

            </div>


            <div
                class="bg-white rounded-xl border border-gray-100 shadow-sm p-5"
            >

                <h2
                    class="font-bold text-gray-900 mb-4"
                >
                    Quick Actions
                </h2>


                <div class="flex flex-wrap gap-3">

                    <button
                        onclick="navigate('home')"
                        class="px-4 py-2.5 bg-indigo-600 text-white rounded-lg font-semibold"
                    >
                        <i class="fas fa-comments mr-1"></i>
                        View Q&A
                    </button>


                    <button
                        onclick="navigate('notes')"
                        class="px-4 py-2.5 border border-gray-200 rounded-lg font-semibold"
                    >
                        <i class="fas fa-book mr-1"></i>
                        View Notes
                    </button>


                    <button
                        onclick="setAdminActiveMode('student')"
                        class="px-4 py-2.5 border border-gray-200 rounded-lg font-semibold"
                    >
                        Preview Student
                    </button>


                    <button
                        onclick="setAdminActiveMode('faculty')"
                        class="px-4 py-2.5 border border-gray-200 rounded-lg font-semibold"
                    >
                        Preview Faculty
                    </button>

                </div>

            </div>

        </div>

    `;

}


/* ============================================================
   MAIN RENDER
============================================================ */

function render() {

    if (
        !currentUser ||
        !currentUserProfile
    ) {
        return;
    }


    /* ADMIN NAV */

    if (
        currentUserProfile.role ===
        "admin"
    ) {

        DOM.adminNavBtn.classList.remove(
            "hidden"
        );


        DOM.modeToggleContainer.classList.remove(
            "hidden"
        );


        DOM.modeToggleContainer.classList.add(
            "flex"
        );


        DOM.previewBanner.classList.remove(
            "hidden"
        );


        DOM.previewRoleText.textContent =
            getRoleLabel(
                adminActiveMode
            );


        ["admin", "faculty", "student"]
            .forEach(mode => {

                const button =
                    document.getElementById(
                        `role-btn-${mode}`
                    );


                if (!button) {
                    return;
                }


                if (
                    adminActiveMode ===
                    mode
                ) {

                    button.className =
                        "px-2.5 py-1 rounded-md text-xs font-bold bg-white text-indigo-700 shadow";

                } else {

                    button.className =
                        "px-2.5 py-1 rounded-md text-xs font-bold text-indigo-200 hover:text-white";

                }

            });


    } else {

        DOM.adminNavBtn.classList.add(
            "hidden"
        );

        DOM.modeToggleContainer.classList.add(
            "hidden"
        );

        DOM.modeToggleContainer.classList.remove(
            "flex"
        );

        DOM.previewBanner.classList.add(
            "hidden"
        );

    }


    /* ACTIVE NAV */

    [
        DOM.navHomeBtn,
        DOM.navNotesBtn,
        DOM.navProfileBtn
    ].forEach(button => {

        button.classList.remove(
            "bg-indigo-600"
        );

    });


    if (currentPage === "home") {

        DOM.navHomeBtn.classList.add(
            "bg-indigo-600"
        );

        DOM.mainContent.innerHTML =
            renderHome();

    }


    else if (
        currentPage === "notes"
    ) {

        DOM.navNotesBtn.classList.add(
            "bg-indigo-600"
        );

        DOM.mainContent.innerHTML =
            renderNotes();

    }


    else if (
        currentPage === "profile"
    ) {

        DOM.navProfileBtn.classList.add(
            "bg-indigo-600"
        );

        DOM.mainContent.innerHTML =
            renderProfile();

    }


    else if (
        currentPage === "admin"
    ) {

        DOM.mainContent.innerHTML =
            renderAdmin();

    }


    else {

        currentPage = "home";

        DOM.mainContent.innerHTML =
            renderHome();

    }

}


/* ============================================================
   PDF BACKDROP
============================================================ */

DOM.pdfModal.addEventListener(
    "click",
    event => {

        if (
            event.target ===
            DOM.pdfModal
        ) {

            closePdfViewer();

        }

    }
);


/* ============================================================
   ESCAPE KEY
============================================================ */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape"
        ) {

            if (
                !DOM.pdfModal.classList.contains(
                    "hidden"
                )
            ) {

                closePdfViewer();

            }

        }

    }
);


/* ============================================================
   FIREBASE AUTH STATE
============================================================ */

onAuthStateChanged(
    auth,
    async user => {

        console.log(
            "Firebase auth state:",
            user
                ? user.email
                : "Logged out"
        );


        if (user) {

            currentUser = user;


            DOM.authScreen.classList.add(
                "hidden"
            );


            DOM.app.classList.remove(
                "hidden"
            );


            await checkProfileAndLoadData();


        } else {

            currentUser = null;

            currentUserProfile = null;


            DOM.app.classList.add(
                "hidden"
            );


            DOM.authScreen.classList.remove(
                "hidden"
            );


            closeProfileModal();


        }


        showLoading(false);

    }
);


/* ============================================================
   START
============================================================ */

showLoading(
    true,
    "Starting CampusHub..."
);

</script>
