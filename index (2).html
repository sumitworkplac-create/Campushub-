/* UTILITIES */
function escapeHtml(value) {
    if (value == null) return "";
    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function showLoading(show, message = "Loading...") {
    DOM.loadingText.textContent = message;
    if (show) {
        DOM.loadingOverlay.classList.remove("hidden");
        DOM.loadingOverlay.classList.add("flex");
    } else {
        DOM.loadingOverlay.classList.add("hidden");
        DOM.loadingOverlay.classList.remove("flex");
    }
}

function showToast(message, type = "success") {
    const toast = document.createElement("div");
    const icons = { success: "fa-circle-check", error: "fa-circle-exclamation", info: "fa-circle-info", warning: "fa-triangle-exclamation" };
    
    toast.className = `toast toast-${type}`;
    toast.innerHTML = `
        <i class="fas ${icons[type] || icons.info}"></i>
        <span style="flex: 1;">${escapeHtml(message)}</span>
        <button type="button" class="toast-close"><i class="fas fa-xmark"></i></button>
    `;
    toast.querySelector("button").addEventListener("click", () => toast.remove());
    DOM.toastContainer.appendChild(toast);
    setTimeout(() => { if (toast.isConnected) toast.remove(); }, 4000);
}

function formatDate(timestamp) {
    if (!timestamp) return "Just now";
    try {
        const date = new Date(timestamp);
        if (Number.isNaN(date.getTime())) return "Just now";
        return date.toLocaleString("en-IN", { day: "numeric", month: "short", year: "numeric", hour: "numeric", minute: "2-digit" });
    } catch { return "Just now"; }
}

    if (photoURL) {
        return `
            <img src="${escapeHtml(photoURL)}" alt="Profile" class="avatar" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
            <div class="avatar-placeholder hidden">${escapeHtml(firstLetter)}</div>
        `;
    }
    return `<div class="avatar-placeholder">${escapeHtml(firstLetter)}</div>`;
}

function getRoleLabel(role) {
    if (role === "admin") return "Admin";
    if (role === "faculty") return "Faculty";
    return "Student";
}

function getEffectiveRole() {
    if (currentUserProfile && currentUserProfile.role === "admin") return adminActiveMode;
    return currentUserProfile?.role || "student";
}

function getCurrentUserName() {
    return currentUserProfile?.name || currentUser?.displayName || currentUser?.email?.split("@")[0] || "User";
}

/* AUTHENTICATION */
async function loginWithGoogle() {
    if (!auth) { showToast("Firebase Auth not available.", "error"); return; }
    DOM.authError.classList.add("hidden");
    DOM.googleLoginBtn.disabled = true;
    showLoading(true, "Connecting with Google...");
    try {
        await signInWithPopup(auth, googleProvider);
    } catch (error) {
        let msg = "Google sign-in failed.";
        if(error.code === "auth/popup-blocked") msg = "Popup blocked. Allow popups and try again.";
        else if(error.code === "auth/popup-closed-by-user") msg = "Sign-in cancelled.";
        DOM.authError.textContent = msg;
        DOM.authError.classList.remove("hidden");
        showToast(msg, "error");
    } finally {
        DOM.googleLoginBtn.disabled = false;
        showLoading(false);
    }
}
DOM.googleLoginBtn.addEventListener("click", loginWithGoogle);

async function logout() {
    try {
        showLoading(true, "Signing out...");
        if (unsubscribeQuestions) { unsubscribeQuestions(); unsubscribeQuestions = null; }
        if (unsubscribeAnswers) { unsubscribeAnswers(); unsubscribeAnswers = null; }
        if (unsubscribeNotes) { unsubscribeNotes(); unsubscribeNotes = null; }
        await signOut(auth);
        currentUser = null; currentUserProfile = null;
        appData = { questions: [], answers: [], notes: [] };
        currentPage = "home";
        DOM.app.classList.remove("flex"); DOM.app.classList.add("hidden");
        DOM.authScreen.classList.remove("hidden"); DOM.authScreen.classList.add("flex");
    } catch (error) { showToast("Logout failed.", "error"); } 
    finally { showLoading(false); }
}
DOM.logoutBtn.addEventListener("click", logout);

async function checkProfileAndLoadData() {
    if (!currentUser) return;
    try {
        showLoading(true, "Loading profile...");
        const userRef = ref(db, 'users/' + currentUser.uid);
        const userSnap = await get(userRef);
        
        if (userSnap.exists()) {
            currentUserProfile = userSnap.val();
            DOM.authScreen.classList.add("hidden"); DOM.authScreen.classList.remove("flex");
            DOM.app.classList.remove("hidden"); DOM.app.classList.add("flex");
            setupRealtimeListeners();

            DOM.profileRole.value = "student";
            DOM.profilePasscode.value = "";
            DOM.authScreen.classList.add("hidden"); DOM.authScreen.classList.remove("flex");

            openProfileModal();
        }
    } catch (error) { 
        console.error(error);
        showToast("Could not load profile. Check Realtime Database rules.", "error"); 
    } 
    finally { showLoading(false); }
}

DOM.profileForm.addEventListener("submit", async (event) => {
    event.preventDefault();
    if (!currentUser) return;
    const name = DOM.profileName.value.trim();

        };
        await set(ref(db, 'users/' + currentUser.uid), profileData);

});

/* REALTIME DATABASE LISTENERS */
function setupRealtimeListeners() {
    if (!currentUser) return;

    if (unsubscribeQuestions) unsubscribeQuestions();
    if (unsubscribeAnswers) unsubscribeAnswers();
    if (unsubscribeNotes) unsubscribeNotes();

    const questionsRef = ref(db, 'questions');
    unsubscribeQuestions = onValue(questionsRef, (snapshot) => {
        const data = snapshot.val();
        appData.questions = data ? Object.keys(data).map(key => ({ id: key, ...data[key] })) : [];
        appData.questions.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
        render();
    });

    const answersRef = ref(db, 'answers');
    unsubscribeAnswers = onValue(answersRef, (snapshot) => {
        const data = snapshot.val();
        appData.answers = data ? Object.keys(data).map(key => ({ id: key, ...data[key] })) : [];
        appData.answers.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
        render();
    });

    const notesRef = ref(db, 'notes');
    unsubscribeNotes = onValue(notesRef, (snapshot) => {
        const data = snapshot.val();
        appData.notes = data ? Object.keys(data).map(key => ({ id: key, ...data[key] })) : [];
        appData.notes.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
        render();
    });
}

/* CRUD ACTIONS (REALTIME DB) */
window.submitQuestion = async function(event) {
    event.preventDefault();
    if (!currentUser) return;
    const form = event.target;
    const title = form.querySelector('[name="title"]').value.trim();
    const body = form.querySelector('[name="body"]').value.trim();
    if (!title || !body) return;
    
    try {
        const newQRef = push(ref(db, 'questions'));
        await set(newQRef, {
            title, body, authorId: currentUser.uid, authorName: getCurrentUserName(),
            authorRole: getEffectiveRole(), authorPhoto: currentUserProfile?.photoURL || currentUser.photoURL || "",
            createdAt: serverTimestamp()
        });
        form.reset();
        showToast("Question posted.", "success");
    } catch (e) { console.error(e); showToast("Error posting question.", "error"); }
};

window.submitAnswer = async function(event, questionId) {
    event.preventDefault();
    if (!currentUser) return;
    const form = event.target;
    const body = form.querySelector('[name="answer"]').value.trim();
    if (!body) return;

    try {
        const newARef = push(ref(db, 'answers'));
        await set(newARef, {
            questionId, body, authorId: currentUser.uid, authorName: getCurrentUserName(),
            authorRole: getEffectiveRole(), authorPhoto: currentUserProfile?.photoURL || currentUser.photoURL || "",
            createdAt: serverTimestamp()
        });
        form.reset();
        showToast("Answer added.", "success");
    } catch (e) { showToast("Error adding answer.", "error"); }
};

window.addNote = async function(event) {
    event.preventDefault();
    if (!currentUser) return;
    const form = event.target;
    const title = form.querySelector('[name="title"]').value.trim();
    const subject = form.querySelector('[name="subject"]').value.trim();
    const pdfUrl = form.querySelector('[name="pdfUrl"]').value.trim();
    if (!title || !subject || !pdfUrl) return;
    
    try {
        const newNRef = push(ref(db, 'notes'));
        await set(newNRef, {
            title, subject, pdfUrl, authorId: currentUser.uid,
            authorName: getCurrentUserName(), authorRole: getEffectiveRole(), createdAt: serverTimestamp()
        });
        form.reset();
        showToast("Note added.", "success");
    } catch (e) { showToast("Error adding note.", "error"); }
};

window.deleteQuestion = async function(id) {
    const q = appData.questions.find(i => i.id === id);
    if (!q || (!((q.authorId === currentUser.uid) || (currentUserProfile?.role === "admin")))) return;
    if (!confirm("Delete this question?")) return;
    try {
        await remove(ref(db, 'questions/' + id));
        appData.answers.filter(a => a.questionId === id).forEach(async a => {
            try { await remove(ref(db, 'answers/' + a.id)); } catch (e) {}
        });
        showToast("Question deleted.", "success");
    } catch (e) { showToast("Error deleting question.", "error"); }
};

window.deleteAnswer = async function(id) {
    const a = appData.answers.find(i => i.id === id);
    if (!a || (!((a.authorId === currentUser.uid) || (currentUserProfile?.role === "admin")))) return;
    if (!confirm("Delete this answer?")) return;
    try {
        await remove(ref(db, 'answers/' + id));
        showToast("Answer deleted.", "success");
    } catch (e) { showToast("Error deleting answer.", "error"); }
};

window.deleteNote = async function(id) {
    const n = appData.notes.find(i => i.id === id);
    if (!n || (!((n.authorId === currentUser.uid) || (currentUserProfile?.role === "admin")))) return;
    if (!confirm("Delete this note?")) return;
    try {
        await remove(ref(db, 'notes/' + id));
        showToast("Note deleted.", "success");
    } catch (e) { showToast("Error deleting note.", "error"); }
};

    } else {
        DOM.adminNavBtn.classList.add("hidden");
        DOM.modeToggleContainer.classList.add("hidden"); DOM.modeToggleContainer.classList.remove("flex");
        DOM.previewBanner.classList.add("hidden");
    }

    [DOM.navHomeBtn, DOM.navNotesBtn, DOM.navProfileBtn].forEach(b => b.classList.remove("active"));

    if (currentPage === "home") { DOM.navHomeBtn.classList.add("active"); DOM.mainContent.innerHTML = renderHome(); } 
    else if (currentPage === "notes") { DOM.navNotesBtn.classList.add("active"); DOM.mainContent.innerHTML = renderNotes(); } 
    else if (currentPage === "profile") { DOM.navProfileBtn.classList.add("active"); DOM.mainContent.innerHTML = renderProfile(); } 
    else if (currentPage === "admin") { DOM.mainContent.innerHTML = renderAdmin(); } 
    else { currentPage = "home"; DOM.navHomeBtn.classList.add("active"); DOM.mainContent.innerHTML = renderHome(); }
}

/* EVENT LISTENERS */
DOM.pdfModal.addEventListener("click", e => { if (e.target === DOM.pdfModal) closePdfViewer(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !DOM.pdfModal.classList.contains("hidden")) closePdfViewer(); });

/* AUTH LISTENER */
onAuthStateChanged(auth, async user => {
    if (user) {
        currentUser = user;
        DOM.authScreen.classList.add("hidden"); DOM.authScreen.classList.remove("flex");
        DOM.app.classList.remove("hidden"); DOM.app.classList.add("flex");
        await checkProfileAndLoadData();
    } else {
        currentUser = null; currentUserProfile = null;
        DOM.app.classList.remove("flex"); DOM.app.classList.add("hidden");
        DOM.authScreen.classList.remove("hidden"); DOM.authScreen.classList.add("flex");
        closeProfileModal();
    }
    showLoading(false);
});

/* STARTUP */
showLoading(true, "Starting CampusHub...");
</script>
</body>
</html>
